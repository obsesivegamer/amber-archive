<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in</title>
</head>
<body>
  <h1>Sign in</h1>
  {% if error %}<p>{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Password <input type="password" name="password" autofocus></label>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
